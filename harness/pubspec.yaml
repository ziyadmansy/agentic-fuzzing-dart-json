name: dart_json_harness
description: >
  Four-way differential JSON deserialization harness (dart:convert manual,
  json_serializable, freezed, built_value) for the agentic-fuzzing-dart-json
  project. See ../docs/dart-oracle-design.md for the design this implements.
publish_to: none
environment:
  sdk: ^3.12.0

dependencies:
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  built_value: ^8.13.0
  built_collection: ^5.1.1

dev_dependencies:
  build_runner: ^2.7.1
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  built_value_generator: ^8.13.0
  lints: ^6.0.0
  test: ^1.26.0
